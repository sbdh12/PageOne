<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFeed - Real Time News</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f9; }
        .navbar { background-color: #171818; }
        .brand-text { color: #fff; font-weight: bold; font-size: 24px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; border: none; height: 100%; }
        .card:hover { transform: translateY(-5px); }
        .card-img-top { height: 200px; object-fit: cover; }
        .news-source { color: #6c757d; font-size: 0.9rem; margin-bottom: 5px; }
        .btn-primary { background-color: #5d3fd3; border: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-text" href="#">FreshFEED</a>
            <span class="text-white">Real-Time News</span>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4 text-center">Top Headlines</h2>
        <div id="news-container" class="row g-4">
            <p class="text-center">Loading news...</p>
        </div>
    </div>

    <script>
        // --- STEP 1: PASTE YOUR KEY HERE ---
        const API_KEY = "ec3f6237fb8c4547a3d89cdce7632e48"; 
        
        // This is the URL we "call" to get news (set to India 'in')
        const url = `https://newsapi.org/v2/top-headlines?country=in&apiKey=${API_KEY}`;

        async function fetchNews() {
            try {
                // Fetch the data
                const response = await fetch(url);
                const data = await response.json();

                const container = document.getElementById('news-container');
                container.innerHTML = ""; // Clear "Loading..." text

                // Loop through the articles and create HTML for each
                data.articles.forEach(article => {
                    // Skip articles with no image to keep it looking pretty
                    if (!article.urlToImage) return;

                    const cardHTML = `
                        <div class="col-md-4">
                            <div class="card">
                                <img src="${article.urlToImage}" class="card-img-top" alt="News Image">
                                <div class="card-body d-flex flex-column">
                                    <div class="news-source">${article.source.name} • ${new Date(article.publishedAt).toLocaleDateString()}</div>
                                    <h5 class="card-title">${article.title}</h5>
                                    <p class="card-text text-muted">${article.description ? article.description.substring(0, 100) + '...' : ''}</p>
                                    <a href="${article.url}" target="_blank" class="btn btn-primary mt-auto">Read More</a>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('news-container').innerHTML = `<h3 class="text-danger text-center">Failed to load news. Check your API Key.</h3>`;
            }
        }

        // Run the function when the page opens
        fetchNews();
    </script>

</body>
</html>
