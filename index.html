<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageOne - The Daily Brief</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Merriweather', serif; color: #111; }
        
        /* HEADER & DATE */
        .top-bar { border-bottom: 1px solid #111; padding: 10px 0; margin-bottom: 20px; }
        .date-display { font-family: sans-serif; font-size: 0.9rem; font-weight: bold; color: #555; text-transform: uppercase; }
        .brand-text { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 900; letter-spacing: -2px; line-height: 1; cursor: pointer; }
        
        /* NAVIGATION */
        .cat-bar { border-top: 1px solid #ddd; border-bottom: 1px solid #111; padding: 10px 0; margin-bottom: 40px; }
        .cat-btn { background: none; border: none; font-family: sans-serif; font-weight: 700; color: #333; text-transform: uppercase; font-size: 0.85rem; padding: 5px 15px; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background-color: #111; color: #fff; }

        /* SECTION HEADERS */
        .section-title { border-left: 5px solid #111; padding-left: 15px; margin: 40px 0 20px; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.8rem; text-transform: uppercase; }

        /* CARDS */
        .news-card { border: none; border-bottom: 1px solid #eee; padding-bottom: 20px; height: 100%; transition: 0.2s; }
        .news-card:hover { transform: translateY(-3px); }
        .news-img { height: 200px; object-fit: cover; width: 100%; margin-bottom: 15px; border-radius: 0; }
        .news-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
        .news-desc { font-size: 0.9rem; color: #555; line-height: 1.6; }
        .badge-cat { background-color: #111; color: #fff; padding: 2px 6px; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; font-family: sans-serif; margin-bottom: 5px; display: inline-block; }

        /* SEARCH */
        .search-box { border: 2px solid #111; padding: 10px; font-family: sans-serif; width: 100%; max-width: 300px; }

        /* FOOTER */
        footer { background: #111; color: #fff; padding: 40px 0; margin-top: 60px; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="container mt-4">
        <div class="top-bar d-flex justify-content-between align-items-end">
            <div id="current-date" class="date-display">Loading Date...</div>
            <div class="d-none d-md-block social-icons">
                <i class="fab fa-twitter mx-2"></i>
                <i class="fab fa-facebook mx-2"></i>
            </div>
        </div>

        <div class="text-center mb-4">
            <h1 class="brand-text" onclick="loadHomePage()">PageOne.</h1>
            <p class="text-muted small">Global Perspective. Real Time.</p>
        </div>

        <div class="cat-bar d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex gap-2 flex-wrap justify-content-center">
                <button class="cat-btn active" onclick="loadHomePage()">Front Page</button>
                <button class="cat-btn" onclick="fetchCategory('business')">Business</button>
                <button class="cat-btn" onclick="fetchCategory('technology')">Tech</button>
                <button class="cat-btn" onclick="fetchCategory('sports')">Sports</button>
                <button class="cat-btn" onclick="fetchCategory('entertainment')">Arts</button>
            </div>
            <input type="text" id="search-input" class="search-box" placeholder="Search feed..." onkeyup="handleSearch()">
        </div>

        <div id="main-content">
            <div class="text-center w-100 mt-5">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="mt-2">Printing the morning edition...</p>
            </div>
        </div>
    </div>

    <footer class="text-center">
        <p class="small mb-1">© 2026 PageOne Media. All rights reserved.</p>
        <p class="small text-muted">Powered by NewsAPI</p>
    </footer>

    <script>
        // 1. SET DATE
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', dateOptions);

        let currentArticles = []; // For search filtering

        // --- 2. THE DASHBOARD LOADER (HOME PAGE) ---
        // This makes 3 calls to get a mix of news
        async function loadHomePage() {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="text-center w-100 mt-5"><div class="spinner-border text-dark"></div></div>`;
            
            // Highlight 'Front Page' button
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.cat-btn').classList.add('active'); // First button is Front Page

            try {
                // Fetch 3 categories in parallel
                // Using 'saurav.tech' mirror (India IN)
                const [bizData, sportData, techData] = await Promise.all([
                    fetch('https://saurav.tech/NewsAPI/top-headlines/category/business/in.json').then(res => res.json()),
                    fetch('https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json').then(res => res.json()),
                    fetch('https://saurav.tech/NewsAPI/top-headlines/category/technology/in.json').then(res => res.json())
                ]);

                // Clear loader
                container.innerHTML = "";

                // Render Section 1: Business (Take top 3)
                if (bizData.articles) {
                    renderSection("Market Watch", "Business", bizData.articles.slice(0, 3));
                }

                // Render Section 2: Sports (Take top 3)
                if (sportData.articles) {
                    renderSection("Sports Action", "Sports", sportData.articles.slice(0, 3));
                }
                
                // Render Section 3: Tech (Take top 3)
                if (techData.articles) {
                    renderSection("Tech & Future", "Technology", techData.articles.slice(0, 3));
                }

                // Save all for search
                currentArticles = [...bizData.articles, ...sportData.articles, ...techData.articles];

            } catch (error) {
                console.error(error);
                // Fallback if IN fails, try US (Honest Backup)
                container.innerHTML = `<div class="text-center text-danger"><h3>Indian servers are slow.</h3><button class="btn btn-dark" onclick="loadUSBackup()">Load Global Edition Instead</button></div>`;
            }
        }

        // --- 3. HELPER TO DRAW A SECTION ---
        function renderSection(title, categoryName, articles) {
            const container = document.getElementById('main-content');
            
            // Create Section Header
            const header = document.createElement('h3');
            header.className = "section-title";
            header.innerText = title;
            container.appendChild(header);

            // Create Row for Cards
            const row = document.createElement('div');
            row.className = "row g-4";

            articles.forEach(article => {
                if (!article.urlToImage || article.title === "[Removed]") return;
                
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="news-card">
                        <span class="badge-cat">${categoryName}</span>
                        <img src="${article.urlToImage}" class="news-img" onerror="this.src='https://via.placeholder.com/300x200'">
                        <h5 class="news-title">${article.title.substring(0, 60)}...</h5>
                        <p class="news-desc">${article.description ? article.description.substring(0, 80) + '...' : ''}</p>
                        <a href="${article.url}" target="_blank" class="text-dark text-decoration-underline small fw-bold">Read Full Story</a>
                    </div>
                `;
                row.appendChild(col);
            });

            container.appendChild(row);
        }

        // --- 4. STANDARD CATEGORY LOADER ---
        // Used when user clicks specific buttons like "Sports"
        async function fetchCategory(category) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="text-center w-100 mt-5"><div class="spinner-border text-dark"></div></div>`;

            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const url = `https://saurav.tech/NewsAPI/top-headlines/category/${category}/in.json`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                container.innerHTML = ""; // Clear loader
                renderSection(category.toUpperCase(), category, data.articles);
                currentArticles = data.articles;

            } catch (error) {
                container.innerHTML = `<h3 class="text-center text-danger">Error loading ${category}.</h3>`;
            }
        }

        // --- 5. SEARCH FUNCTION ---
        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('main-content');
            
            if(!query) {
                loadHomePage(); // Reset to dashboard if empty
                return;
            }

            const filtered = currentArticles.filter(a => a.title && a.title.toLowerCase().includes(query));
            
            container.innerHTML = "";
            if(filtered.length === 0) {
                container.innerHTML = `<h3 class="text-center mt-5">No results for "${query}"</h3>`;
                return;
            }
            renderSection(`Search Results: "${query}"`, "Result", filtered);
        }

        // --- STARTUP ---
        loadHomePage(); 

        // Backup function just in case
        function loadUSBackup() {
            // Logic to fetch US news would go here, simplified for now
            alert("Switching to Global servers...");
            location.reload(); 
        }

    </script>
</body>
</html>
